version: 2

project_name: verbum

before:
  hooks:
    - go mod tidy

builds:
  - id: verbum
    main: ./cmd/verbum
    binary: verbum
    # Pure Go (modernc sqlite) — no cgo, so cross-compilation is trivial.
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: verbum
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# Homebrew tap: publishes a formula to github.com/linusnyman/homebrew-verbum so
# `brew install linusnyman/verbum/verbum` works.
#
# DISABLED until a HOMEBREW_TAP_TOKEN secret (a PAT with write access to the
# homebrew-verbum repo) is added to the verbum repo. Uncomment this block, then
# tag a new release, and the formula will publish automatically.
